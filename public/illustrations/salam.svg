<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300" role="img" aria-labelledby="salam-title">
  <title id="salam-title">Salam – Final greeting in prayer</title>
  <!-- Head turned right -->
  <circle cx="115" cy="80" r="22" fill="#2c3e50"/>
  <!-- Neck -->
  <rect x="96" y="98" width="18" height="14" rx="4" fill="#2c3e50"/>
  <!-- Torso (sitting) -->
  <rect x="72" y="112" width="56" height="60" rx="8" fill="#2c3e50"/>
  <!-- Left arm resting -->
  <line x1="72" y1="130" x2="45" y2="150" stroke="#2c3e50" stroke-width="10" stroke-linecap="round"/>
  <!-- Right arm resting -->
  <line x1="128" y1="130" x2="155" y2="150" stroke="#2c3e50" stroke-width="10" stroke-linecap="round"/>
  <!-- Hands on thighs -->
  <ellipse cx="42" cy="153" rx="9" ry="6" fill="#2c3e50"/>
  <ellipse cx="158" cy="153" rx="9" ry="6" fill="#2c3e50"/>
  <!-- Sitting legs -->
  <rect x="55" y="172" width="90" height="28" rx="8" fill="#2c3e50"/>
  <!-- Feet -->
  <ellipse cx="68" cy="204" rx="14" ry="7" fill="#2c3e50"/>
  <ellipse cx="132" cy="204" rx="14" ry="7" fill="#2c3e50"/>
  <!-- Prayer mat -->
  <rect x="30" y="208" width="140" height="18" rx="6" fill="#27ae60" opacity="0.8"/>
  <!-- Arabic Salam text suggestion (decorative arc) -->
  <path d="M 70 60 Q 100 40 130 60" stroke="#f39c12" stroke-width="3" fill="none" opacity="0.6"/>
</svg>
